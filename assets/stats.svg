<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4+ years, 100+ epics prioritised, 10+ Power BI dashboards, 1M+ records analysed, 95%+ UAT completion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="v" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8935a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8935a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8935a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .n { font-family: Georgia, 'Times New Roman', serif; font-size: 44px; fill: #c9a468; }
    .l { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 3px; fill: #8d8878; }
    .i { opacity: 0; animation: up 1.1s ease-out forwards; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .35s; } .a3 { animation-delay: .6s; } .a4 { animation-delay: .85s; } .a5 { animation-delay: 1.1s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1200" height="150" rx="16" fill="#0f121a" stroke="#ffffff" stroke-opacity="0.08"/>
  <g text-anchor="middle">
    <g class="i a1"><text class="n" x="120" y="76">4+</text><text class="l" x="120" y="104">YEARS</text></g>
    <g class="i a2"><text class="n" x="360" y="76">100+</text><text class="l" x="360" y="104">EPICS PRIORITISED</text></g>
    <g class="i a3"><text class="n" x="600" y="76">10+</text><text class="l" x="600" y="104">POWER BI DASHBOARDS</text></g>
    <g class="i a4"><text class="n" x="840" y="76">1M+</text><text class="l" x="840" y="104">RECORDS ANALYSED</text></g>
    <g class="i a5"><text class="n" x="1080" y="76">95%+</text><text class="l" x="1080" y="104">UAT COMPLETION</text></g>
  </g>
  <g>
    <rect x="240" y="35" width="1" height="80" fill="url(#v)"/>
    <rect x="480" y="35" width="1" height="80" fill="url(#v)"/>
    <rect x="720" y="35" width="1" height="80" fill="url(#v)"/>
    <rect x="960" y="35" width="1" height="80" fill="url(#v)"/>
  </g>
</svg>
