<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three projects currently in progress" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#b8935a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f1dba9"/>
      <stop offset="1" stop-color="#b8935a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="32" y="150" width="316" height="3" rx="1.5"/></clipPath>
    <clipPath id="c2"><rect x="442" y="150" width="316" height="3" rx="1.5"/></clipPath>
    <clipPath id="c3"><rect x="852" y="150" width="316" height="3" rx="1.5"/></clipPath>
  </defs>
  <style>
    .card  { fill: #0f121a; stroke: #ffffff; stroke-opacity: 0.08; }
    .no    { font-family: Georgia, serif; font-size: 13px; letter-spacing: 4px; fill: #b8935a; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; fill: #ece7dc; }
    .desc  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8d8878; }
    .stat  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 4px; fill: #c9a468; }
    .track { fill: #ffffff; fill-opacity: 0.07; }
    .dot   { fill: #e5c88f; animation: pulse 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.6s; }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <!-- Card 1 -->
  <rect class="card" x="0" y="10" width="380" height="210" rx="16"/>
  <text class="no" x="32" y="52">PROJECT 01</text>
  <text class="title" x="32" y="92">Unknown</text>
  <text class="desc" x="32" y="118">Something good. Details soon.</text>
  <rect class="track" x="32" y="150" width="316" height="3" rx="1.5"/>
  <g clip-path="url(#c1)"><rect x="-140" y="150" width="140" height="3" fill="url(#bar)"><animate attributeName="x" from="32" to="348" dur="3.2s" repeatCount="indefinite"/></rect></g>
  <circle class="dot" cx="38" cy="190" r="4"/>
  <text class="stat" x="54" y="194">COOKING</text>

  <!-- Card 2 -->
  <rect class="card" x="410" y="10" width="380" height="210" rx="16"/>
  <text class="no" x="442" y="52">PROJECT 02</text>
  <text class="title" x="442" y="92">Unknown</text>
  <text class="desc" x="442" y="118">Something good. Details soon.</text>
  <rect class="track" x="442" y="150" width="316" height="3" rx="1.5"/>
  <g clip-path="url(#c2)"><rect x="-140" y="150" width="140" height="3" fill="url(#bar)"><animate attributeName="x" from="442" to="758" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></rect></g>
  <circle class="dot d2" cx="448" cy="190" r="4"/>
  <text class="stat" x="464" y="194">COOKING</text>

  <!-- Card 3 -->
  <rect class="card" x="820" y="10" width="380" height="210" rx="16"/>
  <text class="no" x="852" y="52">PROJECT 03</text>
  <text class="title" x="852" y="92">Unknown</text>
  <text class="desc" x="852" y="118">Something good. Details soon.</text>
  <rect class="track" x="852" y="150" width="316" height="3" rx="1.5"/>
  <g clip-path="url(#c3)"><rect x="-140" y="150" width="140" height="3" fill="url(#bar)"><animate attributeName="x" from="852" to="1168" dur="3.2s" begin="1s" repeatCount="indefinite"/></rect></g>
  <circle class="dot d3" cx="858" cy="190" r="4"/>
  <text class="stat" x="874" y="194">COOKING</text>
</svg>
