<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saipreethi Mudrakola — Data, analytics and business decisions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#151a27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b8935a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ecd5a4"/>
      <stop offset="1" stop-color="#b8935a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#e9e4da"/>
      <stop offset="0.42" stop-color="#e9e4da"/>
      <stop offset="0.5" stop-color="#f6dfac"/>
      <stop offset="0.58" stop-color="#e9e4da"/>
      <stop offset="1" stop-color="#e9e4da"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a468" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9a468" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 68px; letter-spacing: 3px; opacity: 0; animation: rise 1.4s 0.3s ease-out forwards; }
    .sub  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 7px; fill: #9a9486; opacity: 0; animation: rise 1.4s 1s ease-out forwards; }
    .tag  { font-family: Georgia, serif; font-style: italic; font-size: 17px; fill: #b8935a; opacity: 0; animation: rise 1.4s 1.6s ease-out forwards; }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 2.2s 0.6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <circle cx="600" cy="160" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;290;240" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g fill="#ecd5a4">
    <circle cx="180" cy="250" r="1.6" opacity="0.5"><animate attributeName="cy" values="250;70;250" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="290" r="1.2" opacity="0.4"><animate attributeName="cy" values="290;40;290" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="270" r="1.8" opacity="0.5"><animate attributeName="cy" values="270;60;270" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="240" r="1.3" opacity="0.4"><animate attributeName="cy" values="240;50;240" dur="20s" repeatCount="indefinite"/></circle>
  </g>

  <text class="name" x="600" y="152" text-anchor="middle" fill="url(#shine)">SAIPREETHI MUDRAKOLA</text>

  <line class="line" x1="340" y1="182" x2="860" y2="182" stroke="url(#gold)" stroke-width="1.5"/>

  <text class="sub" x="600" y="222" text-anchor="middle">DATA  ·  ANALYTICS  ·  BUSINESS DECISIONS</text>
  <text class="tag" x="600" y="262" text-anchor="middle">turning numbers into decisions that matter</text>
</svg>
